[project]
name = "hermes-aws-ssm-secret-source"
version = "0.2.0"
description = "AWS SSM Parameter Store secret source plugin for Hermes Agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "BoldBlack" }]
keywords = ["hermes", "hermes-agent", "plugin", "aws", "ssm", "secrets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/boldblackai/hermes-aws-ssm-secret-source"
Repository = "https://github.com/boldblackai/hermes-aws-ssm-secret-source"
Issues = "https://github.com/boldblackai/hermes-aws-ssm-secret-source/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.13", "ty>=0.0.1", "hermes-agent>=0.19", "boto3>=1.34"]

# ── pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ── ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# ── uv ────────────────────────────────────────────────────────────────
[tool.uv]
exclude-newer = "7d"
